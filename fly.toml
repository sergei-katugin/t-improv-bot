app = "t-improv-bot"
primary_region = "arn"  # Stockholm — ближайший к Кипру

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite+aiosqlite:////data/impro.db"

[[mounts]]
  source = "impro_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # processes omitted — default to app

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
