# fly.toml app configuration file generated for t-improv-bot on 2026-06-24T19:00:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 't-improv-bot'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'sqlite+aiosqlite:////data/impro.db'

[[mounts]]
  source = 'impro_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = "512mb"
