services:
  - type: web
    name: t-impro-bot
    env: python
    plan: 0.5c-512mb
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python -m alembic upgrade head && python main.py
    autoDeploy: true
    envVars:
      - key: ADMIN_BOT_TOKEN
        sync: false  # set in the Render dashboard
      - key: PUBLIC_BOT_TOKEN
        sync: false  # set in the Render dashboard
      - key: DATABASE_URL
        sync: false  # set in the Render dashboard
      - key: WEBHOOK_BASE_URL
        sync: false  # set to the public HTTPS URL, or leave blank to use RENDER_EXTERNAL_URL
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false  # set in the Render dashboard
      - key: ADMIN_IDS
        sync: false  # set in the Render dashboard
